<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>

<style>

body{
    margin:0;
    padding:40px;
    background:#f5f7fb;
    font-family:Arial,Helvetica,sans-serif;
}

.wrapper{
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.header{
    background:#0F172A;
    color:white;
    padding:25px;
    font-size:24px;
    font-weight:bold;
}

.content{
    padding:40px;
    color:#374151;
    line-height:1.7;
}

.footer{
    padding:20px;
    text-align:center;
    font-size:13px;
    color:#9CA3AF;
    border-top:1px solid #E5E7EB;
}

.button{
    display:inline-block;
    padding:14px 28px;
    background:#2563EB;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="wrapper">

<div class="header">
InvoiAI
</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

<div class="footer">

© {{ year }} InvoiAI

</div>

</div>

</body>

</html>
